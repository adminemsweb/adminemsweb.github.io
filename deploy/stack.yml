version: '3.8'
services:
  web:
    image: metallrack:${RELEASE_TAG}
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        traefik.enable: 'true'
        traefik.docker.network: traefik_public
        traefik.http.routers.metallrack.rule: Host(`metallrack.com.br`) || Host(`www.metallrack.com.br`)
        traefik.http.routers.metallrack.entrypoints: websecure
        traefik.http.routers.metallrack.tls: 'true'
        traefik.http.routers.metallrack.tls.certresolver: le
        traefik.http.services.metallrack.loadbalancer.server.port: '80'
networks:
  traefik_public:
    external: true
